<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Pedido</h1>
        <form id="pedidoForm">
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="link">Link do YouTube/Transmissão:</label>
                <input type="text" class="form-control" id="link" required>
            </div>
            <div class="form-group">
                <label for="arquivo">Arquivo (audio para Atas):</label>
                <input type="file" class="form-control-file" id="arquivo">
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
        <div id="message" class="mt-3"></div>
    </div>
    <script>
        document.getElementById('pedidoForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const link = document.getElementById('link').value;
            const arquivo = document.getElementById('arquivo').files[0];
            fetch('C:\\renovar\\trab\\processar-pedido.php', {
                method: 'POST',
                body: new FormData(this)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('message').innerText = data.message;
            })
            .catch(error => {
                document.getElementById('message').innerText = 'Erro ao enviar pedido.';
            });
        });
    </script>
</body>
</html>
