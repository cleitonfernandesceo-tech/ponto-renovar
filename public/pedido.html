<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pedido de Corte</title>
    <style>
        body {font-family: Arial, sans-serif; margin:0; padding:20px; background:#f9f9f9;}
        .container {max-width:600px; margin:auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.1);}
        h1 {color:#2c3e50;}
        label {display:block; margin-top:10px;}
        input, textarea {width:100%; padding:8px; margin-top:4px; border:1px solid #ccc; border-radius:4px;}
        button {margin-top:15px; padding:10px 20px; background:#27ae60; color:#fff; border:none; border-radius:4px; cursor:pointer;}
        button:hover {background:#219150;}
        .quota {margin-top:15px; font-weight:bold; color:#e67e22;}
    </style>
</head>
<body>
<div class="container">
    <h1>Solicitar Corte de Pregação</h1>
    <form id="pedidoForm">
        <label for="email">E‑mail (para entrega):</label>
        <input type="email" id="email" name="email" required>

        <label for="cota">Cota restante (horas):</label>
        <input type="number" id="cota" name="cota" min="0" step="0.1" readonly value="0">

        <label for="link">Link do YouTube / transmissão (ou deixe vazio):</label>
        <input type="url" id="link" name="link">

        <label for="arquivo">Arquivo de áudio (opcional):</label>
        <input type="file" id="arquivo" name="arquivo" accept="audio/*">

        <button type="submit">Enviar Pedido</button>
    </form>
    <div class="quota" id="quotaInfo"></div>
</div>

<script>
    // Simulação de obtenção da cota do cliente (substituir por chamada real ao backend)
    const clienteId = 'exemplo@igreja.com'; // placeholder
    fetch(/api/cota?email=)
        .then(r=>r.json())
        .then(d=>{ document.getElementById('cota').value = d.cota; 
                    document.getElementById('quotaInfo').textContent = Cota restante:  horas; })
        .catch(()=>{ document.getElementById('quotaInfo').textContent = 'Não foi possível obter a cota.'; });

    // Submissão do formulário (placeholder – adaptar ao endpoint real)
    document.getElementById('pedidoForm').addEventListener('submit', e=>{
        e.preventDefault();
        const formData = new FormData(e.target);
        fetch('/api/pedido', {method:'POST', body:formData})
            .then(r=>r.json())
            .then(d=>alert(d.mensagem))
            .catch(()=>alert('Erro ao enviar o pedido.'));
    });
</script>
</body>
</html>
